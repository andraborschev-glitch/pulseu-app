<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Twinner — Трекер привычек</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            padding: 16px 12px 32px;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .month-nav button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .month-nav button:active { opacity: 0.6; }

        .month-label {
            font-size: 15px;
            font-weight: 700;
            min-width: 120px;
            text-align: center;
            color: rgba(255,255,255,0.9);
        }

        /* ===== ОБЩИЙ ПРОГРЕСС ===== */
        .summary-row {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .summary-card {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            text-align: center;
        }

        .summary-card .s-label {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .summary-card .s-value {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .summary-card .s-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }

        .ring-wrap {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto;
        }

        .ring-wrap svg { transform: rotate(-90deg); }

        .ring-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
        }

        /* ===== СЕТКА ПРИВЫЧЕК ===== */
        .grid-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            margin-bottom: 18px;
        }

        .grid-table {
            min-width: 680px;
            border-collapse: collapse;
        }

        /* Заголовок с днями */
        .grid-table thead th {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            font-weight: 600;
            padding: 8px 0;
            text-align: center;
            min-width: 26px;
        }

        .grid-table thead th.habit-col {
            text-align: left;
            padding-left: 14px;
            min-width: 140px;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .grid-table thead th.progress-col {
            min-width: 56px;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            padding-right: 10px;
        }

        /* Строка недели */
        .week-separator th {
            background: rgba(255,255,255,0.03);
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            padding: 4px 0;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .week-separator th.habit-col {
            text-align: left;
            padding-left: 14px;
        }

        /* Строка привычки */
        .grid-table tbody tr.habit-row {
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .habit-name-cell {
            padding: 8px 10px 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .habit-emoji { font-size: 16px; }

        .habit-title {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
        }

        /* Ячейка дня */
        .day-cell {
            text-align: center;
            padding: 4px 2px;
            cursor: pointer;
        }

        .day-cell .dot {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 1.5px solid rgba(255,255,255,0.12);
            margin: 0 auto;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .day-cell .dot.done {
            border-color: transparent;
        }

        .day-cell .dot.today-marker {
            border-color: rgba(255,255,255,0.4);
        }

        .day-cell .dot.future {
            opacity: 0.3;
        }

        /* Прогресс колонка */
        .progress-cell {
            padding: 4px 10px 4px 4px;
            text-align: right;
            white-space: nowrap;
        }

        .progress-cell .prog-text {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
        }

        .progress-cell .prog-bar-wrap {
            width: 44px;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            margin-top: 3px;
            overflow: hidden;
            display: inline-block;
        }

        .progress-cell .prog-bar-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        /* ===== ЕЖЕНЕДЕЛЬНЫЙ ПРОГРЕСС ===== */
        .weekly-section {
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .weekly-row {
            display: flex;
            gap: 8px;
        }

        .week-card {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 10px 6px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }

        .week-card .wk-label {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .week-ring {
            position: relative;
            width: 46px;
            height: 46px;
            margin: 0 auto 4px;
        }

        .week-ring svg { transform: rotate(-90deg); }

        .week-ring-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }

        /* ===== ТРЕКЕР ВЕСА ===== */
        .weight-section {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.07);
            margin-bottom: 18px;
        }

        .weight-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .weight-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .weight-today-val {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .weight-diff-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 600;
        }

        .weight-diff-badge.up { background: rgba(248,113,113,0.15); color: #f87171; }
        .weight-diff-badge.down { background: rgba(74,222,128,0.15); color: #4ade80; }
        .weight-diff-badge.same { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.4); }

        .weight-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 48px;
            margin-bottom: 10px;
        }

        .weight-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            height: 100%;
            justify-content: flex-end;
        }

        .weight-bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.4s ease;
            min-height: 4px;
        }

        .weight-bar-label {
            font-size: 9px;
            color: rgba(255,255,255,0.3);
        }

        .weight-bar-label.today { color: #a5b4fc; }

        .weight-input-row {
            display: flex;
            gap: 8px;
        }

        .weight-input-row input {
            flex: 1;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 9px 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
        }

        .weight-input-row input::placeholder { color: rgba(255,255,255,0.25); }

        .weight-input-row button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .weight-input-row button:active { opacity: 0.8; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .footer {
            text-align: center;
            color: rgba(255,255,255,0.12);
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .footer span {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ШАПКА -->
<div class="header">
    <div class="logo">⚡ TWINNER</div>
    <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button onclick="changeMonth(1)">›</button>
    </div>
</div>

<!-- СВОДКА -->
<div class="summary-row">
    <div class="summary-card">
        <div class="s-label">Выполнено</div>
        <div class="s-value" id="summaryDone">0</div>
        <div class="s-sub" id="summaryTotal">из 0</div>
    </div>
    <div class="summary-card">
        <div class="s-label">Серия</div>
        <div class="s-value" id="summaryStreak">0</div>
        <div class="s-sub">дней подряд</div>
    </div>
    <div class="summary-card" style="display:flex;align-items:center;justify-content:center;">
        <div class="ring-wrap">
            <svg width="64" height="64" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
                <circle cx="32" cy="32" r="26" fill="none" stroke="url(#rg)" stroke-width="6"
                    stroke-linecap="round" stroke-dasharray="163.4" id="ringProgress" stroke-dashoffset="163.4"/>
                <defs>
                    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#667eea"/>
                        <stop offset="100%" stop-color="#f093fb"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="ring-pct" id="ringPct">0%</div>
        </div>
    </div>
</div>

<!-- СЕТКА ПРИВЫЧЕК -->
<div class="grid-container">
    <table class="grid-table" id="habitGrid">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
    </table>
</div>

<!-- ЕЖЕНЕДЕЛЬНЫЙ ПРОГРЕСС -->
<div class="weekly-section">
    <div class="section-title">Прогресс по неделям</div>
    <div class="weekly-row" id="weeklyRow"></div>
</div>

<!-- ТРЕКЕР ВЕСА -->
<div class="weight-section">
    <div class="weight-header-row">
        <div class="weight-title">⚖️ Вес</div>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="weight-today-val" id="weightToday">— кг</div>
            <div class="weight-diff-badge same" id="weightDiff"></div>
        </div>
    </div>
    <div class="weight-chart" id="weightChart"></div>
    <div class="weight-input-row">
        <input type="number" id="weightInput" placeholder="Вес (кг)..." min="20" max="300" step="0.1"/>
        <button onclick="saveWeight()">Сохранить</button>
    </div>
</div>

<div class="footer">⚡ <span>Twinner</span> · твой цифровой двойник</div>

<script>
// =============================================
//  TWINNER — ТРЕКЕР ПРИВЫЧЕК
// =============================================

const HABITS = [
    { id: 'pushups', emoji: '💪', name: 'Отжимания',      color: '#667eea' },
    { id: 'water',   emoji: '💧', name: 'Выпить воду',    color: '#38bdf8' },
    { id: 'read',    emoji: '📖', name: 'Почитать книгу', color: '#a78bfa' },
    { id: 'walk',    emoji: '🚶', name: 'Прогулка 30 мин',color: '#34d399' },
    { id: 'shower',  emoji: '🚿', name: 'Холодный душ',   color: '#60a5fa' },
];

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAYS_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

let viewDate = new Date();
viewDate.setDate(1);

// data[YYYY-MM][habitId][day] = true/false
// weightLog[YYYY-MM-DD] = number
let data = {};
let weightLog = {};

function getMonthKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function getTodayStr() {
    const t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function daysInMonth(d) {
    return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
}

function load() {
    const saved = localStorage.getItem('twinner_v2');
    if (saved) {
        try {
            const p = JSON.parse(saved);
            data = p.data || {};
            weightLog = p.weightLog || {};
        } catch(e) {}
    }
}

function save() {
    localStorage.setItem('twinner_v2', JSON.stringify({ data, weightLog }));
}

function toggleHabit(habitId, day) {
    const mk = getMonthKey(viewDate);
    if (!data[mk]) data[mk] = {};
    if (!data[mk][habitId]) data[mk][habitId] = {};
    data[mk][habitId][day] = !data[mk][habitId][day];
    save();
    render();
    const done = data[mk][habitId][day];
    showToast(done ? '✅ Выполнено!' : '↩️ Отменено');
}

// ===== РЕНДЕР =====
function render() {
    renderMonthLabel();
    renderGrid();
    renderSummary();
    renderWeekly();
    renderWeight();
}

function renderMonthLabel() {
    document.getElementById('monthLabel').textContent =
        MONTHS_RU[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
}

function renderGrid() {
    const days = daysInMonth(viewDate);
    const mk = getMonthKey(viewDate);
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === viewDate.getFullYear() &&
                           today.getMonth() === viewDate.getMonth();

    // Заголовок
    const head = document.getElementById('gridHead');
    let headHtml = '<tr><th class="habit-col">Привычка</th>';
    for (let d = 1; d <= days; d++) {
        const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
        const dayName = DAYS_SHORT[date.getDay()];
        const isToday = isCurrentMonth && d === today.getDate();
        headHtml += `<th style="${isToday ? 'color:#a5b4fc;' : ''}">${d}<br><span style="font-weight:400;opacity:0.6">${dayName}</span></th>`;
    }
    headHtml += '<th class="progress-col">Итог</th></tr>';
    head.innerHTML = headHtml;

    // Тело
    const body = document.getElementById('gridBody');
    let bodyHtml = '';

    HABITS.forEach(habit => {
        bodyHtml += `<tr class="habit-row">`;
        bodyHtml += `<td><div class="habit-name-cell"><span class="habit-emoji">${habit.emoji}</span><span class="habit-title">${habit.name}</span></div></td>`;

        let doneCount = 0;
        const maxDay = isCurrentMonth ? today.getDate() : days;

        for (let d = 1; d <= days; d++) {
            const isDone = data[mk]?.[habit.id]?.[d] === true;
            const isFuture = isCurrentMonth && d > today.getDate();
            const isToday = isCurrentMonth && d === today.getDate();
            if (isDone) doneCount++;

            let dotClass = 'dot';
            if (isDone) dotClass += ' done';
            else if (isFuture) dotClass += ' future';
            else if (isToday) dotClass += ' today-marker';

            const dotStyle = isDone ? `background:${habit.color};box-shadow:0 0 8px ${habit.color}55;` : '';
            const check = isDone ? '✓' : '';

            bodyHtml += `<td class="day-cell" onclick="toggleHabit('${habit.id}',${d})">
                <div class="${dotClass}" style="${dotStyle}">${check}</div>
            </td>`;
        }

        const pct = maxDay > 0 ? Math.round((doneCount / maxDay) * 100) : 0;
        bodyHtml += `<td class="progress-cell">
            <div class="prog-text">${doneCount}/${maxDay}</div>
            <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${pct}%;background:${habit.color}"></div></div>
        </td>`;
        bodyHtml += '</tr>';
    });

    body.innerHTML = bodyHtml;
}

function renderSummary() {
    const days = daysInMonth(viewDate);
    const mk = getMonthKey(viewDate);
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === viewDate.getFullYear() &&
                           today.getMonth() === viewDate.getMonth();
    const maxDay = isCurrentMonth ? today.getDate() : days;

    let total = 0, done = 0;
    HABITS.forEach(h => {
        for (let d = 1; d <= maxDay; d++) {
            total++;
            if (data[mk]?.[h.id]?.[d]) done++;
        }
    });

    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('summaryDone').textContent = done;
    document.getElementById('summaryTotal').textContent = `из ${total}`;
    document.getElementById('ringPct').textContent = pct + '%';

    const circumference = 163.4;
    const offset = circumference - (pct / 100) * circumference;
    document.getElementById('ringProgress').style.strokeDashoffset = offset;

    // Серия дней подряд (все привычки выполнены)
    let streak = 0;
    const checkDate = new Date();
    while (true) {
        const cmk = getMonthKey(checkDate);
        const cd = checkDate.getDate();
        const allDone = HABITS.every(h => data[cmk]?.[h.id]?.[cd] === true);
        if (!allDone) break;
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
        if (streak > 365) break;
    }
    document.getElementById('summaryStreak').textContent = streak;
}

function renderWeekly() {
    const days = daysInMonth(viewDate);
    const mk = getMonthKey(viewDate);
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === viewDate.getFullYear() &&
                           today.getMonth() === viewDate.getMonth();

    const weeks = [];
    let week = { start: 1, end: 0 };
    for (let d = 1; d <= days; d++) {
        const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
        if (date.getDay() === 0 && d > 1) {
            week.end = d - 1;
            weeks.push({...week});
            week = { start: d, end: 0 };
        }
    }
    week.end = days;
    weeks.push(week);

    const colors = ['#667eea','#38bdf8','#a78bfa','#34d399','#f093fb'];
    let html = '';

    weeks.forEach((w, i) => {
        let total = 0, done = 0;
        for (let d = w.start; d <= w.end; d++) {
            const isFuture = isCurrentMonth && d > today.getDate();
            if (isFuture) continue;
            HABITS.forEach(h => {
                total++;
                if (data[mk]?.[h.id]?.[d]) done++;
            });
        }
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        const color = colors[i % colors.length];
        const circ = 125.7;
        const offset = circ - (pct / 100) * circ;

        html += `<div class="week-card">
            <div class="wk-label">Нед. ${i+1}</div>
            <div class="week-ring">
                <svg width="46" height="46" viewBox="0 0 46 46">
                    <circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="4"/>
                    <circle cx="23" cy="23" r="20" fill="none" stroke="${color}" stroke-width="4"
                        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
                </svg>
                <div class="week-ring-pct">${pct}%</div>
            </div>
        </div>`;
    });

    document.getElementById('weeklyRow').innerHTML = html;
}

function renderWeight() {
    const today = getTodayStr();
    const todayVal = weightLog[today];
    document.getElementById('weightToday').textContent = todayVal ? `${todayVal} кг` : '— кг';

    // Разница
    const diffEl = document.getElementById('weightDiff');
    const keys = Object.keys(weightLog).sort();
    const todayIdx = keys.indexOf(today);
    if (todayVal && todayIdx > 0) {
        const prev = weightLog[keys[todayIdx - 1]];
        const diff = (todayVal - prev).toFixed(1);
        if (diff > 0) { diffEl.textContent = `▲ +${diff}`; diffEl.className = 'weight-diff-badge up'; }
        else if (diff < 0) { diffEl.textContent = `▼ ${diff}`; diffEl.className = 'weight-diff-badge down'; }
        else { diffEl.textContent = '= без изм.'; diffEl.className = 'weight-diff-badge same'; }
    } else { diffEl.textContent = ''; diffEl.className = 'weight-diff-badge same'; }

    // Мини-график (последние 7 записей)
    const chart = document.getElementById('weightChart');
    const last7 = keys.slice(-7);
    if (last7.length === 0) { chart.innerHTML = '<div style="font-size:12px;color:rgba(255,255,255,0.2);margin:auto;">Нет данных</div>'; return; }

    const vals = last7.map(k => weightLog[k]);
    const minV = Math.min(...vals) - 1;
    const maxV = Math.max(...vals) + 1;
    const range = maxV - minV || 1;

    chart.innerHTML = last7.map(k => {
        const v = weightLog[k];
        const h = Math.max(4, Math.round(((v - minV) / range) * 40));
        const d = new Date(k);
        const label = `${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}`;
        const isT = k === today;
        const color = isT ? '#667eea' : 'rgba(255,255,255,0.15)';
        return `<div class="weight-bar-col">
            <div style="font-size:10px;color:${isT?'#a5b4fc':'rgba(255,255,255,0.4)'};margin-bottom:2px;">${v}</div>
            <div class="weight-bar" style="height:${h}px;background:${color};"></div>
            <div class="weight-bar-label ${isT?'today':''}">${label}</div>
        </div>`;
    }).join('');
}

function saveWeight() {
    const input = document.getElementById('weightInput');
    const val = parseFloat(input.value.replace(',', '.'));
    if (isNaN(val) || val < 20 || val > 300) return;
    weightLog[getTodayStr()] = val;
    // Оставляем 90 дней
    const keys = Object.keys(weightLog).sort();
    if (keys.length > 90) keys.slice(0, keys.length - 90).forEach(k => delete weightLog[k]);
    input.value = ''; input.blur();
    save();
    renderWeight();
    showToast('⚖️ Вес сохранён!');
}

document.getElementById('weightInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveWeight();
});

function changeMonth(dir) {
    viewDate.setMonth(viewDate.getMonth() + dir);
    render();
}

let toastTimer;
function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
}

load();
render();
</script>
</body>
</html>
